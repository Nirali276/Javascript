<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>count like and dislike</h2>
    <button class="like-btn" onclick="updateCount('like')">Like 👍 <span id='like'>0</span></button>
    <button class="dislike-btn" onclick="updateCount('dislike')">Dislike 👎 <span id='dislike'>0</span></button>

    <script>
        let counts = { like: 0, dislike: 0 };

        const updateCount = (type) => {
            counts[type]++;
            document.getElementById(type).innerText = counts[type];
        };
    </script>
</body>
</html>
