<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let fruits=["Apple","Banana","pineapple"];
        document.write("original Array:",fruits,"<br>");

        fruits.push("Strawberry");
        document.write("After push('Strawberry'):", fruits,"<br>");

        fruits.pop();
        document.write("After pop():",fruits,"<br>");

        fruits.reverse();
        document.write("After reverse():", fruits,"<br>");

        fruits.sort();
        document.write("After sort():", fruits,"<br>");

        let slicedFruits = fruits.slice(1, 3);
        document.write("slice(1, 3):", slicedFruits,"<br>");

        let moreFruits = ["Mango", "Kiwi"];
        let allFruits = fruits.concat(moreFruits);
        document.write("After concat(moreFruits):",allFruits,"<br>");
        
        fruits.splice(1, 1, "Blueberry", "Cherry"); 
        document.write("After splice(1, 1, 'Blueberry', 'Cherry'):", fruits,"<br>");

    </script>
</body>
</html>
